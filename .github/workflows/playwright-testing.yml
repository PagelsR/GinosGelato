name: Playwright Testing - Daily Schedule

on:
  push:
    branches:
      - main
  schedule:
    # Runs daily at 6:00 AM EST (11:00 AM UTC) to generate Application Insights telemetry
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

env:
  NODE_VERSION: '20.x'

jobs:
  run-playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: |
          echo "Installing npm packages..."
          npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          echo "Running the full suite (journeys + faults + flaky) against the deployed Static Web App..."
          npx playwright test
        continue-on-error: true

      - name: Upload Playwright Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runner-results-${{ github.run_number }}
          path: |
            test-results.json
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Test Results Summary
        if: always()
        run: |
          echo "## 🖥️ CI Runner Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran single-threaded on the GitHub-hosted runner. Metrics and the combined dashboard are published by the **Publish to Test Dashboard** job once both test jobs finish." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** https://pagelsr.github.io/GinosGelato/" >> $GITHUB_STEP_SUMMARY

  run-playwright-tests-at-scale:
    name: Validate at Scale (Azure Playwright Workspaces)
    runs-on: ubuntu-latest
    # Runs in parallel with run-playwright-tests (true fan-out). Neither job
    # touches gh-pages directly; the publish-dashboard job below fans back in
    # after both complete and does the one single-writer gh-pages publish.
    env:
      CI: true
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: |
          echo "Installing npm packages..."
          npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run stable suite on Azure cloud browsers (Playwright Workspaces)
        run: |
          echo "Running the stable suite (journeys only, FLAKY specs excluded) in parallel on managed cloud browsers..."
          # Tee'd so the reporting-upload check below can inspect the
          # Workspaces reporter's output; pipefail keeps the test exit code.
          set -o pipefail
          npx playwright test --config=playwright.service.config.ts --workers=20 --grep-invert "FLAKY|Flaky Test Examples" 2>&1 | tee playwright-run.log
        continue-on-error: true

      - name: Upload Playwright Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-scale-results-${{ github.run_number }}
          path: |
            test-results.json
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Testing at Scale Summary
        if: always()
        run: |
          echo "## ☁️ Playwright Testing at Scale (Azure Playwright Workspaces)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Same /e2e/ suite as the CI Runner job, executed in parallel on Azure-managed cloud browsers (20 workers)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Metrics and the combined dashboard are published by the **Publish toTest Dashboard** job once both test jobs finish." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard (blended with CI Runner runs):** https://pagelsr.github.io/GinosGelato/" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure-native scale reporting (Playwright Workspace):** Azure Portal → Azure App Testing → Playwright Workspaces → this workspace's Test runs — parallel workers, per-test traces/screenshots/recordings, and Live View for this exact run." >> $GITHUB_STEP_SUMMARY

      # Test failures are tolerated above (continue-on-error), but a failed
      # report upload must not be: the run still shows up in the Portal's
      # Test runs list, yet opening it returns "HTTP 404: The specified blob
      # does not exist" because no artifacts were ever uploaded. Usually means
      # the CI service principal lacks Storage Blob Data Contributor on the
      # workspace's linked storage account.
      - name: Verify Playwright Workspaces reporting upload
        if: always()
        run: |
          if grep -q "Reporting upload status: FAILED" playwright-run.log 2>/dev/null; then
            REASON=$(grep -A1 "Reporting upload status: FAILED" playwright-run.log | tail -n 1)
            echo "::error title=Playwright Workspaces reporting upload FAILED::${REASON}"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ❌ **Playwright Workspaces reporting upload FAILED** — this run will show HTTP 404 in Azure Portal. ${REASON}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Playwright Workspaces reporting upload did not report a failure."

  publish-dashboard:
    name: Publish to Test Dashboard
    runs-on: ubuntu-latest
    # Fan-in: waits for both parallel test jobs above, then does the ONE
    # gh-pages checkout/merge/push for both result sets — this is what keeps
    # the fan-out above race-free (single writer to gh-pages).
    needs: [run-playwright-tests, run-playwright-tests-at-scale]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download CI Runner results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-runner-results-${{ github.run_number }}
          path: ci-runner-results

      - name: Download Cloud Scale results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cloud-scale-results-${{ github.run_number }}
          path: cloud-scale-results

      - name: Checkout gh-pages branch for history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-content

      - name: Extract Test Metrics and Update History (both run types)
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}"
          DATE=$(date +%Y-%m-%d)

          mkdir -p deployment-content

          # Seed test-history.json from whatever is already published
          if [ -f "gh-pages-content/test-history.json" ]; then
            cp gh-pages-content/test-history.json ./test-history.json
          else
            echo "[]" > test-history.json
          fi

          # --- CI Runner (single worker, GitHub-hosted runner) ---
          if [ -f "ci-runner-results/test-results.json" ]; then
            REPORT_DIR="reports/${DATE}-run-${RUN_ID}"
            mkdir -p deployment-content/$REPORT_DIR
            if [ -d "ci-runner-results/playwright-report" ]; then
              cp -r ci-runner-results/playwright-report/* deployment-content/$REPORT_DIR/
            fi
            REPORT_URL="https://pagelsr.github.io/GinosGelato/${REPORT_DIR}"
            node .github/scripts/extract-test-metrics.js ci-runner-results/test-results.json test-history.json $RUN_ID "$REPORT_URL" "${{ github.ref_name }}" "ci-runner" "1"
            cp current-run-summary.json deployment-content/
          else
            echo "No CI Runner test-results.json found (job may have failed before producing results) — skipping that entry"
          fi

          # --- Cloud Scale (Azure Playwright Workspaces, 20 workers) ---
          if [ -f "cloud-scale-results/test-results.json" ]; then
            REPORT_DIR="reports/${DATE}-run-${RUN_ID}-cloud-scale"
            mkdir -p deployment-content/$REPORT_DIR
            if [ -d "cloud-scale-results/playwright-report" ]; then
              cp -r cloud-scale-results/playwright-report/* deployment-content/$REPORT_DIR/
            fi
            REPORT_URL="https://pagelsr.github.io/GinosGelato/${REPORT_DIR}"
            node .github/scripts/extract-test-metrics.js cloud-scale-results/test-results.json test-history.json $RUN_ID "$REPORT_URL" "${{ github.ref_name }}" "cloud-scale" "20"
            cp current-run-summary.json deployment-content/
          else
            echo "No Cloud Scale test-results.json found (job may have failed before producing results) — skipping that entry"
          fi

          cp test-history.json deployment-content/

          # Copy dashboard as index.html
          cp .github/pages/dashboard.html deployment-content/index.html

          # Copy existing reports (preserve history of all prior runs)
          if [ -d "gh-pages-content/reports" ]; then
            mkdir -p deployment-content/reports
            cp -r gh-pages-content/reports/* deployment-content/reports/ || true
          fi

          echo "Deployment structure ready"
          ls -la deployment-content/

      - name: Publish Test Dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_ACCESSTOKEN_PAGES }}
          publish_branch: gh-pages
          publish_dir: deployment-content
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy test report for run #${{ github.run_number }} (CI Runner + Cloud Scale)'

      - name: Dashboard Summary
        if: always()
        run: |
          echo "## 📊 Combined Playwright Test Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 View Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** https://pagelsr.github.io/GinosGelato/" >> $GITHUB_STEP_SUMMARY
          echo "- **CI Runner Report:** https://pagelsr.github.io/GinosGelato/reports/$(date +%Y-%m-%d)-run-${{ github.run_number }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Scale Report:** https://pagelsr.github.io/GinosGelato/reports/$(date +%Y-%m-%d)-run-${{ github.run_number }}-cloud-scale/" >> $GITHUB_STEP_SUMMARY
